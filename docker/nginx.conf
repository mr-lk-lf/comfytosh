server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The site lives under /comfytosh/, like on GitHub Pages.
    location = / {
        return 302 /comfytosh/;
    }

    location /comfytosh/ {
        try_files $uri $uri/ =404;
    }

    error_page 404 /comfytosh/404.html;
}
